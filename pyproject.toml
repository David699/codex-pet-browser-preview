[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-pet-browser-preview"
version = "0.1.0"
description = "Local browser preview tool for Codex Desktop pet spritesheets."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Codex Pet Browser Preview contributors" }]
keywords = ["codex", "pet", "spritesheet", "preview"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
codex-pet-preview = "codex_pet_browser_preview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_pet_browser_preview = ["assets/*.html"]
